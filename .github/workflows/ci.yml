# Plan item I3: on every push, the unit tests for lib/, the PC tool
# self-test (with Linux g++) and the firmware build. Nothing here touches
# hardware; bench tests stay with Ben.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Native tests and tool self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Zombie tree, for the software-in-the-loop checks in the self-test
      # (plan M5c). Only libopeninv is needed of its submodules.
      - uses: actions/checkout@v4
        with:
          repository: SomersetEV/Stm32-vcu
          ref: Tractor-RPM-limiting-testing
          path: Stm32-vcu
      - name: Zombie submodule libopeninv
        run: git -C Stm32-vcu submodule update --init libopeninv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install PlatformIO and tool requirements
        run: pip install platformio -r tools/requirements.txt
      - name: Unit tests (pio test -e native)
        run: pio test -e native
      - name: Tool self-test
        env:
          ZOMBIE_DIR: ${{ github.workspace }}/Stm32-vcu
        run: python tools/selftest.py

  firmware:
    name: Firmware build (tcan485)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO platforms and toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -e tcan485
