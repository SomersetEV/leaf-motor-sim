# Theory test, no baler: tractor on the road at full pedal, the governor
# holding revlim against a slowly changing gradient. Rough numbers for about
# 2.5 t at ~25 km/h, ~0.03 m of travel per motor radian:
#   reflected inertia J ~2.5 kg.m2; rolling ~20 Nm at the motor; a 5-6 % climb
#   ~60 Nm; a 4 % descent ~-15 Nm net (overrun, the governor must regen).
# Road roughness 3 Nm at 2 Hz.
#
# Speed noise and inertia, from the tractor logs of 7 Nov 2026 (telematics
# session_0011 and 0012, road driving and towing):
# - Reported speed ripples about 9-11 rpm RMS at roughly 6 Hz, with or
#   without the governor in control, and while the torque request is flat.
#   The governor sees it as speed noise. White noise cannot match it at more
#   than one govFlt (it needs about 11 at shift 4 but 16 at shift 2), so the
#   noise is band-limited: tools/fit_noise.py fits noise 11, noise_fc 6,
#   noise_bw 4, which gives the governor the tractor's noise within 5 % at
#   every shift (plan item I6, 10 Nov 2026). One setting for every set.
# - A rough fit between logger bursts gives J 2.7-3.8 kg.m2 (r2 0.4-0.6;
#   gear unknown). 2.5 stays as the base, and two sets repeat at J 3.5 to
#   check the ranking holds across that range.
# - Plan section 16: at this inertia govKp 11 is two to three times softer
#   than the loop allows, so three sets try govKp 20-30 at shift 2. Ki 3 with
#   govKp 25 is an integral time of about 0.8 s, about 4 over the predicted
#   crossover.
# Each set ends with the gradient taken off (tail_s) for the ring metrics.
# Check peak_integral_pct is 0 on the Ki 0 sets: sweep.py clears the
# integral at the start of each set.
#   python sweep.py scripts/sweep_road.yaml --port COM3 --out <folder>
load:
  preset: default
  cmds: ["load noise 3 2"]
  grad: [[0, 20], [10, 20], [25, 60], [40, 60], [55, -15], [70, -15], [80, 20], [90, 20]]
settle_s: 8
run_s: 90
tail_s: 4
base: {govKp: 11, govKd: 0, sim: {J: 2.5, noise: 11, noise_fc: 6, noise_bw: 4}}
sets:
  - {govKi: 0, govFlt: 4}   # the tractor today
  - {govKi: 0, govFlt: 2}
  - {govKi: 1, govFlt: 4}
  - {govKi: 1, govFlt: 2}   # best on the placeholder baler
  - {govKi: 0, govFlt: 4, sim: {J: 3.5}}      # top of the logged inertia range
  - {govKi: 1, govFlt: 2, sim: {J: 3.5}}
  - {govKp: 20, govKi: 0, govFlt: 2}          # section 16: stiffer, for this inertia
  - {govKp: 30, govKi: 0, govFlt: 2}
  - {govKp: 25, govKi: 3, govFlt: 2}
