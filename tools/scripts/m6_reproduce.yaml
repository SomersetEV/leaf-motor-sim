# M6 closed-loop check: replay baler_bench.csv with the model and Zombie gains
# of the run it was made from (sweep_kd_baler run 1), so the speed trace should
# match that run's. Restores the tractor gains at the end.
#   python run_script.py scripts/m6_reproduce.yaml --port COM3 --log m6r.txt --canlog-out m6r_bus.log
baud: 921600
reply_timeout_s: 5
steps:
  - {at: 0.0,  cmd: "preset noload"}
  - {at: 0.2,  cmd: "set J 0.9"}
  - {at: 0.4,  cmd: "set Tc 10"}
  - {at: 0.6,  cmd: "profile load baler_bench"}
  - {at: 1.5,  cmd: "zset GovLog 1"}
  - {at: 1.7,  cmd: "zset govKi 1"}
  - {at: 1.9,  cmd: "zset govFlt 2"}
  - {at: 2.0,  cmd: "canlog 1"}
  - {at: 10.0, cmd: "profile start"}
  - {at: 41.0, cmd: "canlog 0"}
  - {at: 41.5, cmd: "preset noload"}
  - {at: 42.0, cmd: "zset govKi 0"}
  - {at: 42.2, cmd: "zset govFlt 4"}
  - {at: 42.4, cmd: "zset GovLog 0"}
