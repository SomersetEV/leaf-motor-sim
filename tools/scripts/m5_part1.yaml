# M5 bench, steps 1 to 5 (docs/bench/M5_loads_console.md). Times are seconds from the start.
# Before starting: Zombie in Run, governor holding revlim, pedal at 100 %, GovLog on,
# SavvyCAN logging. Afterwards power-cycle the LilyGo and run m5_part2.yaml.
#   python run_script.py scripts/m5_part1.yaml --port COM3 --log m5_part1.txt
baud: 921600
steps:
  # 1. Telemetry: J=0.300 in stat and 0x4B1
  - {at: 0.0,   cmd: "preset default"}
  - {at: 2.0,   cmd: "stat"}
  - {at: 3.0,   cmd: "params"}
  # 2. Step
  - {at: 5.0,   cmd: "mark 1"}
  - {at: 10.0,  cmd: "load step 60 500"}
  - {at: 25.0,  cmd: "stat"}
  - {at: 26.0,  cmd: "load step 0"}
  # 3. Pulse
  - {at: 40.0,  cmd: "mark 2"}
  - {at: 41.0,  cmd: "load pulse 150 700 40"}
  - {at: 56.0,  cmd: "stat"}
  - {at: 57.0,  cmd: "load off"}
  # 4. Presets
  - {at: 70.0,  cmd: "mark 3"}
  - {at: 71.0,  cmd: "preset baler"}
  - {at: 73.0,  cmd: "stat"}
  - {at: 90.0,  cmd: "preset pto_step"}
  - {at: 91.0,  cmd: "stat"}
  - {at: 100.0, cmd: "stat"}
  - {at: 110.0, cmd: "preset default"}
  # 5. Parameters, first half
  - {at: 120.0, cmd: "mark 4"}
  - {at: 121.0, cmd: "set J 0.5"}
  - {at: 122.0, cmd: "params"}
  - {at: 123.0, cmd: "save"}
  - {at: 124.0, cmd: "mark 5"}
