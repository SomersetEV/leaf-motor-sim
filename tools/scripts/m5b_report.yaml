# M5b bench check of the reported speed (plan items I6 and I7), with the
# Zombie in run mode and the pedal held so the governor holds revlim. The
# model runs at J 2.5: at the default 0.3 the no-load loop has so little
# phase margin at shift 4 (about 7 degrees) that 20 ms more delay could
# make it ring for good.
#   python run_script.py scripts/m5b_report.yaml --port COM3 --canlog-out m5b_report.log
#   python m5b_check.py m5b_report.log
# Between marks 1 and 2: rptdelay 20 ms, with a load step so the speed moves.
# Between marks 2 and 3: the tractor's band noise, delay off.
# Mark 4 onwards: white noise of the same level, for comparison.
baud: 921600
steps:
  - {at: 0.0,  cmd: "preset default"}
  - {at: 0.2,  cmd: "set J 2.5"}         # road inertia: 20 ms of delay costs only a few degrees here
  - {at: 0.5,  cmd: "canlog 1"}
  - {at: 1.0,  cmd: "set rptdelay 20"}
  - {at: 1.5,  cmd: "mark 1"}
  - {at: 4.0,  cmd: "load step 60"}
  - {at: 7.0,  cmd: "load off"}
  - {at: 10.0, cmd: "set rptdelay 0"}
  - {at: 10.2, cmd: "mark 2"}
  - {at: 10.5, cmd: "set noise_fc 6"}
  - {at: 10.6, cmd: "set noise_bw 4"}
  - {at: 10.7, cmd: "set noise 11"}
  - {at: 41.0, cmd: "mark 3"}
  - {at: 41.5, cmd: "set noise_fc 0"}
  - {at: 42.0, cmd: "mark 4"}
  - {at: 72.0, cmd: "mark 5"}
  - {at: 72.5, cmd: "set noise 0"}
  - {at: 73.0, cmd: "canlog 0"}
  - {at: 73.5, cmd: "params"}
  - {at: 74.0, cmd: "preset default"}    # J back to its default
