; Leaf motor simulator, see docs/SIMULATOR_PLAN.md

[platformio]
default_envs = tcan485

; Firmware for the LilyGo T-CAN485 (ESP32)
; pioarduino "stable" (55.03.30 when written) = Arduino-ESP32 3.3.0 on ESP-IDF 5.5
[env:tcan485]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 921600
build_flags = -Wall

; PC build for unit tests of the pure C++ libraries in lib/
[env:native]
platform = native
test_framework = unity
build_flags = -Wall -std=c++17
